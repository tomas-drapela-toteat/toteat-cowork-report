 $332 (39%)&lt;/div&gt;&lt;h3&gt;Métricas clave&lt;/h3&gt;&lt;div class=&quot;alert neutral&quot;&gt;&lt;strong&gt;7&lt;/strong&gt; altas / &lt;strong&gt;5&lt;/strong&gt; bajas en el período&lt;/div&gt;&lt;div class=&quot;alert green&quot;&gt;&lt;strong&gt;Saldo positivo&lt;/strong&gt; de +$191&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;🎯 Real vs Presupuesto&lt;/h2&gt;&lt;div class=&quot;net-row&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Net&lt;/span&gt;&lt;div class=&quot;net-bar pos&quot;&gt;&lt;div class=&quot;fill pos&quot; style=&quot;width:4%&quot;&gt;&lt;/div&gt;&lt;span class=&quot;label-inline&quot;&gt;vs Pres: $2,262&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;val pos&quot;&gt;+$191&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;bigbox pos&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Net New Argentina&lt;/div&gt;&lt;div class=&quot;val pos&quot;&gt;+$191&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Ratio 1.6× · 8% del presupuesto ($2,262)&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Bajo objetivo:&lt;/strong&gt; sólo 8% del presupuesto alcanzado.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;panel-container&quot;&gt;&lt;div class=&quot;grid3&quot;&gt;&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;📊 KPIs Net New&lt;/h2&gt;&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi pos&quot;&gt;&lt;div class=&quot;label&quot;&gt;Net New MRR&lt;/div&gt;&lt;div class=&quot;value&quot;&gt;+$0.00&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Crecimiento&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;label&quot;&gt;Presupuesto&lt;/div&gt;&lt;div class=&quot;value&quot;&gt;$55&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;% ejec: 0%&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi accent&quot;&gt;&lt;div class=&quot;label&quot;&gt;Altas MRR&lt;/div&gt;&lt;div class=&quot;value&quot;&gt;$0.00&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;0 altas&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi accent&quot;&gt;&lt;div class=&quot;label&quot;&gt;Churns MRR&lt;/div&gt;&lt;div class=&quot;value&quot;&gt;$0.00&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;0 bajas&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;alert amber&quot;&gt;&lt;strong&gt;⚠ Margen estrecho:&lt;/strong&gt; ratio 0.0× entre altas y churns&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;💧 Waterfall Net New&lt;/h2&gt;&lt;div class=&quot;waterfall-wrap&quot;&gt;&lt;canvas id=&quot;wf-5&quot; class=&quot;waterfall-canvas&quot; width=&quot;380&quot; height=&quot;230&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;&lt;h3&gt;Altas vs Churns&lt;/h3&gt;&lt;div class=&quot;comp-row&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;MRR&lt;/span&gt;&lt;div class=&quot;comp-bar&quot;&gt;&lt;div class=&quot;altas&quot; style=&quot;width:0%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;churns&quot; style=&quot;width:0%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;val&quot;&gt;+$0.00&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;font-size:11px;color:#4a3f30;margin-top:6px&quot;&gt;Altas: $0.00 (0%) · Churns: $0.00 (0%)&lt;/div&gt;&lt;h3&gt;Métricas clave&lt;/h3&gt;&lt;div class=&quot;alert neutral&quot;&gt;&lt;strong&gt;0&lt;/strong&gt; altas / &lt;strong&gt;0&lt;/strong&gt; bajas en el período&lt;/div&gt;&lt;div class=&quot;alert green&quot;&gt;&lt;strong&gt;Saldo positivo&lt;/strong&gt; de +$0.00&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;🎯 Real vs Presupuesto&lt;/h2&gt;&lt;div class=&quot;net-row&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Net&lt;/span&gt;&lt;div class=&quot;net-bar pos&quot;&gt;&lt;div class=&quot;fill pos&quot; style=&quot;width:0%&quot;&gt;&lt;/div&gt;&lt;span class=&quot;label-inline&quot;&gt;vs Pres: $55&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;val pos&quot;&gt;+$0.00&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;bigbox pos&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Net New Perú&lt;/div&gt;&lt;div class=&quot;val pos&quot;&gt;+$0.00&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Ratio 0.0× · 0% del presupuesto ($55)&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Bajo objetivo:&lt;/strong&gt; sólo 0% del presupuesto alcanzado.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
const WF_DATA = {&quot;0&quot;: {&quot;altas&quot;: 9651.31, &quot;churns&quot;: 12440.0, &quot;net&quot;: -2788.6900000000005}, &quot;1&quot;: {&quot;altas&quot;: 6727.139999999999, &quot;churns&quot;: 8490.0, &quot;net&quot;: -1762.8600000000006}, &quot;2&quot;: {&quot;altas&quot;: 869.8799999999999, &quot;churns&quot;: 2189.0, &quot;net&quot;: -1319.1200000000001}, &quot;3&quot;: {&quot;altas&quot;: 1531.35, &quot;churns&quot;: 1429.0, &quot;net&quot;: 102.34999999999991}, &quot;4&quot;: {&quot;altas&quot;: 522.94, &quot;churns&quot;: 332.0, &quot;net&quot;: 190.94000000000005}, &quot;5&quot;: {&quot;altas&quot;: 0.0, &quot;churns&quot;: 0.0, &quot;net&quot;: 0.0}};

function showTab(idx, el){
  document.querySelectorAll(&#x27;.tab&#x27;).forEach(t=&gt;t.classList.remove(&#x27;active&#x27;));
  document.querySelectorAll(&#x27;.panel-container&#x27;).forEach(p=&gt;p.classList.remove(&#x27;active&#x27;));
  el.classList.add(&#x27;active&#x27;);
  document.querySelectorAll(&#x27;.panel-container&#x27;)[idx].classList.add(&#x27;active&#x27;);
  drawWaterfall(idx);
}

function drawWaterfall(idx){
  const d = WF_DATA[idx];
  if(!d) return;
  const canvas = document.getElementById(&#x27;wf-&#x27;+idx);
  if(!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth;
  const H = canvas.clientHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext(&#x27;2d&#x27;);
  ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,W,H);
  
  const al = d.altas, ch = d.churns, net = d.net;
  const maxV = Math.max(al, Math.abs(net)+ch, 1);
  
  const padX = 40, padTop = 30, padBot = 50;
  const chartH = H - padTop - padBot;
  const barW = (W - padX*2) / 5;
  const gap = barW * 0.4;
  const bw = barW - gap;
  
  // Y axis baseline
  const baseY = padTop + chartH;
  ctx.strokeStyle = &#x27;#E3DBCC&#x27;;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padX, baseY); ctx.lineTo(W-padX, baseY);
  ctx.stroke();
  
  function barY(v){ return baseY - (v/maxV)*chartH; }
  
  // ALTAS bar
  const x1 = padX + gap/2;
  const h1 = (al/maxV)*chartH;
  ctx.fillStyle = &#x27;#3a7a5a&#x27;;
  ctx.fillRect(x1, baseY-h1, bw, h1);
  ctx.fillStyle = &#x27;#1B1B1B&#x27;;
  ctx.font = &#x27;11px -apple-system, sans-serif&#x27;;
  ctx.textAlign = &#x27;center&#x27;;
  ctx.fillText(&#x27;ALTAS&#x27;, x1+bw/2, H-padBot+18);
  ctx.fillStyle = &#x27;#3a7a5a&#x27;;
  ctx.font = &#x27;bold 12px sans-serif&#x27;;
  ctx.fillText(&#x27;+$&#x27;+Math.round(al).toLocaleString(), x1+bw/2, baseY-h1-8);
  
  // CHURNS bar (starts from top of ALTAS, goes down)
  const x2 = padX + gap/2 + barW*2;
  const churnsTop = baseY - h1;  // top of altas
  const h2 = (ch/maxV)*chartH;
  ctx.fillStyle = &#x27;#FF4B33&#x27;;
  ctx.fillRect(x2, churnsTop, bw, h2);
  ctx.fillStyle = &#x27;#1B1B1B&#x27;;
  ctx.font = &#x27;11px sans-serif&#x27;;
  ctx.fillText(&#x27;CHURNS&#x27;, x2+bw/2, H-padBot+18);
  ctx.fillStyle = &#x27;#FF4B33&#x27;;
  ctx.font = &#x27;bold 12px sans-serif&#x27;;
  ctx.fillText(&#x27;-$&#x27;+Math.round(ch).toLocaleString(), x2+bw/2, churnsTop+h2+22);
  
  // Connector from altas top to churns top, and to net top
  ctx.strokeStyle = &#x27;#888&#x27;;
  ctx.setLineDash([3,3]);
  ctx.beginPath();
  ctx.moveTo(x1+bw, baseY-h1); ctx.lineTo(x2, baseY-h1);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2+bw, churnsTop+h2);
  
  // NET NEW bar
  const x3 = padX + gap/2 + barW*4;
  const netVal = Math.abs(net);
  const h3 = (netVal/maxV)*chartH;
  let netTop, netBot;
  if(net &gt;= 0){
    netBot = baseY;
    netTop = baseY - h3;
  } else {
    netTop = baseY;
    netBot = baseY + h3;
  }
  ctx.lineTo(x3, net&gt;=0 ? netTop : netBot);
  ctx.stroke();
  ctx.setLineDash([]);
  
  ctx.fillStyle = net&gt;=0 ? &#x27;#3a7a5a&#x27; : &#x27;#FF4B33&#x27;;
  ctx.fillRect(x3, Math.min(netTop, netBot), bw, h3);
  ctx.fillStyle = &#x27;#1B1B1B&#x27;;
  ctx.font = &#x27;11px sans-serif&#x27;;
  ctx.fillText(&#x27;NET NEW&#x27;, x3+bw/2, H-padBot+18);
  ctx.fillStyle = net&gt;=0 ? &#x27;#3a7a5a&#x27; : &#x27;#FF4B33&#x27;;
  ctx.font = &#x27;bold 13px sans-serif&#x27;;
  const sign = net&gt;=0 ? &#x27;+&#x27; : &#x27;-&#x27;;
  ctx.fillText(sign+&#x27;$&#x27;+Math.round(Math.abs(net)).toLocaleString(), x3+bw/2, net&gt;=0 ? netTop-8 : netBot+22);
  
  // Title
  ctx.fillStyle = &#x27;#4a3f30&#x27;;
  ctx.font = &#x27;10px sans-serif&#x27;;
  ctx.textAlign = &#x27;left&#x27;;
  ctx.fillText(&#x27;USD · Julio 2026&#x27;, padX, 18);
}

// Initial draw for total
setTimeout(()=&gt;drawWaterfall(0), 100);
window.addEventListener(&#x27;resize&#x27;, ()=&gt;{
  const active = document.querySelector(&#x27;.panel-container.active&#x27;);
  if(active){
    const idx = Array.from(document.querySelectorAll(&#x27;.panel-container&#x27;)).indexOf(active);
    drawWaterfall(idx);
  }
});
&lt;/script&gt;
