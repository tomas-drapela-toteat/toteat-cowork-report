.header{background:#1B1B1B;color:#fff;padding:14px 18px;border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:18px;font-weight:700;letter-spacing:-0.3px}
.header .sub{color:#E3DBCC;font-size:12px}
.tabs{background:#1B1B1B;display:flex;gap:0;padding:0 8px;overflow-x:auto}
.tab{padding:10px 16px;color:#E3DBCC;cursor:pointer;border-bottom:3px solid transparent;font-size:13px;font-weight:500;white-space:nowrap;transition:all .15s}
.tab:hover{color:#fff}
.tab.active{background:#fff;color:#1B1B1B;border-bottom-color:#FF4B33;border-radius:6px 6px 0 0}
.panel-container{display:none}
.panel-container.active{display:block}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.panel{background:#fff;border:1px solid #E3DBCC;border-radius:10px;padding:14px;min-height:200px}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:0.5px;color:#4a3f30;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #E3DBCC;font-weight:700}
.panel h3{font-size:12px;color:#4a3f30;margin:10px 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{background:#f7f4ef;border:1px solid #E3DBCC;border-radius:6px;padding:8px 10px}
.kpi .label{font-size:10px;color:#4a3f30;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:2px}
.kpi .value{font-size:19px;font-weight:700;color:#1B1B1B;line-height:1.1}
.kpi .sub{font-size:10px;color:#4a3f30;margin-top:2px}
.kpi.accent .value{color:#FF4B33}
.budget-bar{margin:10px 0}
.budget-bar .lbl{display:flex;justify-content:space-between;font-size:11px;color:#4a3f30;margin-bottom:4px}
.budget-bar .bar-bg{background:#E3DBCC;height:18px;border-radius:9px;overflow:hidden;position:relative}
.budget-bar .bar-fill{background:linear-gradient(90deg,#3a7a5a,#5aa07a);height:100%;border-radius:9px;transition:width .4s}
.budget-bar .desv{font-size:11px;margin-top:4px}
.alert{padding:8px 10px;border-radius:6px;font-size:11px;margin:6px 0;border-left:3px solid}
.alert.red{background:#fff1ee;border-color:#FF4B33;color:#b82e1a}
.alert.green{background:#e8f5ee;border-color:#3a7a5a;color:#1a4a38}
.alert.amber{background:#fff8e8;border-color:#b85c00;color:#7a3d00}
.alert.neutral{background:#f7f4ef;border-color:#E3DBCC;color:#4a3f30}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f0ebe0;font-size:11px;gap:6px}
.list-item:last-child{border-bottom:none}
.list-item .name{font-weight:600;color:#1B1B1B;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .meta{display:flex;gap:6px;align-items:center;flex-shrink:0}
.badge{display:inline-block;padding:2px 6px;border-radius:8px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px}
.badge.red{background:#FF4B33;color:#fff}
.badge.amber{background:#b85c00;color:#fff}
.badge.green{background:#3a7a5a;color:#fff}
.badge.cream{background:#E3DBCC;color:#4a3f30}
.badge.dark{background:#1B1B1B;color:#fff}
.badge.violet{background:#8e44ad;color:#fff}
.semaforo{font-weight:700;font-size:11px;padding:2px 6px;border-radius:4px}
.semaforo.red{background:#fff1ee;color:#b82e1a}
.semaforo.amber{background:#fff8e8;color:#b85c00}
.semaforo.green{background:#e8f5ee;color:#3a7a5a}
.owner-card{background:#f7f4ef;border:1px solid #E3DBCC;border-radius:6px;padding:8px 10px;margin-bottom:8px}
.owner-card .row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.owner-card .name{font-weight:700;font-size:12px;color:#1B1B1B}
.owner-card .mrr{font-weight:700;font-size:13px;color:#FF4B33}
.owner-card .row2{font-size:10px;color:#4a3f30;margin-bottom:4px}
.owner-card .tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.owner-card .footer{font-size:10px;color:#4a3f30;margin-top:4px;font-style:italic}
.bar-row{display:grid;grid-template-columns:120px 1fr 1fr;gap:6px;align-items:center;margin-bottom:5px;font-size:11px}
.bar-row .lbl{color:#1B1B1B;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .pct-n,.bar-row .pct-mrr{position:relative;height:14px;background:#E3DBCC;border-radius:7px;overflow:hidden}
.bar-row .pct-n .fill{background:#4a3f30;height:100%;border-radius:7px}
.bar-row .pct-mrr .fill{background:#FF4B33;height:100%;border-radius:7px}
.bar-row .val{position:absolute;right:5px;top:50%;transform:translateY(-50%);font-size:9px;color:#fff;font-weight:700;text-shadow:0 0 2px rgba(0,0,0,0.5)}
.bar-legend{display:flex;gap:12px;font-size:10px;color:#4a3f30;margin-bottom:6px;align-items:center}
.bar-legend .swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:3px;vertical-align:middle}
.table-cuentas{width:100%;font-size:10px;border-collapse:collapse;margin-top:6px}
.table-cuentas th{background:#f7f4ef;color:#4a3f30;padding:4px 6px;text-align:left;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;font-size:9px;border-bottom:1px solid #E3DBCC;position:sticky;top:0}
.table-cuentas td{padding:4px 6px;border-bottom:1px solid #f0ebe0;vertical-align:middle}
.table-cuentas td.mrr{color:#FF4B33;font-weight:700;text-align:right}
.table-cuentas .scroll{max-height:340px;overflow-y:auto}
.note{font-size:10px;color:#4a3f30;font-style:italic;margin-top:10px;padding:8px;background:#f7f4ef;border-radius:6px;border-left:3px solid #E3DBCC}
.country-summary{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.country-card{background:#f7f4ef;border:1px solid #E3DBCC;border-radius:6px;padding:8px;text-align:center}
.country-card .flag{font-size:20px}
.country-card .name{font-size:11px;font-weight:700;margin-top:2px}
.country-card .mrr{font-size:14px;font-weight:700;color:#FF4B33;margin-top:2px}
.country-card .n{font-size:10px;color:#4a3f30}
.country-card .pct{font-size:10px;color:#4a3f30;margin-top:2px}
.fc-panel{background:#fff;border:1px solid #E3DBCC;border-radius:10px;padding:14px;margin-top:10px;border-top:3px solid #FF4B33}
.fc-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.fc-head h2{font-size:13px;text-transform:uppercase;letter-spacing:0.5px;color:#4a3f30;font-weight:700}
.fc-head .meta{font-size:10px;color:#888}
.fc-flow{display:grid;grid-template-columns:1fr 24px 1fr 24px 1fr;gap:6px;align-items:center;margin-bottom:12px}
.fc-box{background:#f7f4ef;border:1px solid #E3DBCC;border-radius:8px;padding:10px 12px;text-align:center}
.fc-box.proj{background:#e8f5ee;border-color:#a3d4b8}
.fc-box .lbl{font-size:9px;color:#4a3f30;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:3px}
.fc-box .big{font-size:22px;font-weight:700;line-height:1.05}
.fc-box .mrr{font-size:13px;font-weight:700;color:#FF4B33;margin-top:1px}
.fc-box.proj .mrr{color:#1a4a38}
.fc-box .rng{font-size:9px;color:#888;margin-top:2px}
.fc-arrow{font-size:18px;color:#FF4B33;text-align:center;font-weight:700}
.fc-bar .lbl{display:flex;justify-content:space-between;font-size:11px;color:#4a3f30;margin-bottom:4px}
.fc-bar .bar-bg{background:#E3DBCC;height:16px;border-radius:8px;overflow:hidden;position:relative}
.fc-bar .bar-fill{background:linear-gradient(90deg,#FF4B33,#ff7a66);height:100%;border-radius:8px}
.fc-bar .bar-real{position:absolute;left:0;top:0;height:100%;background:#3a7a5a;border-radius:8px;opacity:.85}
.fc-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.fc-mini{width:100%;font-size:10px;border-collapse:collapse}
.fc-mini th{color:#4a3f30;text-align:left;font-size:9px;text-transform:uppercase;padding:3px 5px;border-bottom:1px solid #E3DBCC}
.fc-mini td{padding:3px 5px;border-bottom:1px solid #f0ebe0}
.fc-mini td.r{text-align:right;font-weight:700}
.fc-chip{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;margin-right:3px}
.fc-chip.v{background:#e8f5ee;color:#3a7a5a}
.fc-chip.a{background:#fff8e8;color:#b85c00}
.fc-chip.r{background:#fff1ee;color:#b82e1a}
.fc-chip.t{background:#f0ebe0;color:#4a3f30}
.fc-note{font-size:10px;color:#4a3f30;font-style:italic;margin-top:8px;padding:7px;background:#f7f4ef;border-radius:6px;border-left:3px solid #E3DBCC}
&lt;/style&gt;

.&lt;/div&gt;&lt;div class=&quot;alert amber&quot;&gt;&lt;strong&gt;⚠ Margen estrecho:&lt;/strong&gt; ratio 0.0× entre altas y churns&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;💧 Waterfall Net New&lt;/h2&gt;&lt;div class=&quot;waterfall-wrap&quot;&gt;&lt;canvas id=&quot;wf-5&quot; class=&quot;waterfall-canvas&quot; width=&quot;380&quot; height=&quot;230&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;&lt;h3&gt;Altas vs Churns&lt;/h3&gt;&lt;div class=&quot;comp-row&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;MRR&lt;/span&gt;&lt;div class=&quot;comp-bar&quot;&gt;&lt;div class=&quot;altas&quot; style=&quot;width:0%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;churns&quot; style=&quot;width:0%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;val&quot;&gt;+$0.00&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;font-size:11px;color:#4a3f30;margin-top:6px&quot;&gt;Altas: $0.00 (0%) · Churns: $0.00 (0%)&lt;/div&gt;&lt;h3&gt;Métricas clave&lt;/h3&gt;&lt;div class=&quot;alert neutral&quot;&gt;&lt;strong&gt;0&lt;/strong&gt; altas / &lt;strong&gt;0&lt;/strong&gt; bajas en el período&lt;/div&gt;&lt;div class=&quot;alert green&quot;&gt;&lt;strong&gt;Saldo positivo&lt;/strong&gt; de +$0.00&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;🎯 Real vs Presupuesto&lt;/h2&gt;&lt;div class=&quot;net-row&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;Net&lt;/span&gt;&lt;div class=&quot;net-bar pos&quot;&gt;&lt;div class=&quot;fill pos&quot; style=&quot;width:0%&quot;&gt;&lt;/div&gt;&lt;span class=&quot;label-inline&quot;&gt;vs Pres: $58&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;val pos&quot;&gt;+$0.00&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;bigbox pos&quot;&gt;&lt;div class=&quot;lbl&quot;&gt;Net New Perú&lt;/div&gt;&lt;div class=&quot;val pos&quot;&gt;+$0.00&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;Ratio 0.0× · 0% del presupuesto ($58)&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;&lt;strong&gt;Bajo objetivo:&lt;/strong&gt; sólo 0% del presupuesto alcanzado.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

&lt;script&gt;
const WF_DATA = {&quot;0&quot;: {&quot;altas&quot;: 2916.8500000000004, &quot;churns&quot;: 903.0, &quot;net&quot;: 2013.8500000000004}, &quot;1&quot;: {&quot;altas&quot;: 2340.2700000000004, &quot;churns&quot;: 359.0, &quot;net&quot;: 1981.2700000000004}, &quot;2&quot;: {&quot;altas&quot;: 0.0, &quot;churns&quot;: 28.0, &quot;net&quot;: -28.0}, &quot;3&quot;: {&quot;altas&quot;: 497.81, &quot;churns&quot;: 362.0, &quot;net&quot;: 135.81}, &quot;4&quot;: {&quot;altas&quot;: 78.77, &quot;churns&quot;: 154.0, &quot;net&quot;: -75.23}, &quot;5&quot;: {&quot;altas&quot;: 0.0, &quot;churns&quot;: 0.0, &quot;net&quot;: 0.0}};

function showTab(idx, el){
  document.querySelectorAll(&#x27;.tab&#x27;).forEach(t=&gt;t.classList.remove(&#x27;active&#x27;));
  document.querySelectorAll(&#x27;.panel-container&#x27;).forEach(p=&gt;p.classList.remove(&#x27;active&#x27;));
  el.classList.add(&#x27;active&#x27;);
  document.querySelectorAll(&#x27;.panel-container&#x27;)[idx].classList.add(&#x27;active&#x27;);
  drawWaterfall(idx);
}

function drawWaterfall(idx){
  const d = WF_DATA[idx];
  if(!d) return;
  const canvas = document.getElementById(&#x27;wf-&#x27;+idx);
  if(!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth;
  const H = canvas.clientHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext(&#x27;2d&#x27;);
  ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,W,H);
  
  const al = d.altas, ch = d.churns, net = d.net;
  const maxV = Math.max(al, Math.abs(net)+ch, 1);
  
  const padX = 40, padTop = 30, padBot = 50;
  const chartH = H - padTop - padBot;
  const barW = (W - padX*2) / 5;
  const gap = barW * 0.4;
  const bw = barW - gap;
  
  // Y axis baseline
  const baseY = padTop + chartH;
  ctx.strokeStyle = &#x27;#E3DBCC&#x27;;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padX, baseY); ctx.lineTo(W-padX, baseY);
  ctx.stroke();
  
  function barY(v){ return baseY - (v/maxV)*chartH; }
  
  // ALTAS bar
  const x1 = padX + gap/2;
  const h1 = (al/maxV)*chartH;
  ctx.fillStyle = &#x27;#3a7a5a&#x27;;
  ctx.fillRect(x1, baseY-h1, bw, h1);
  ctx.fillStyle = &#x27;#1B1B1B&#x27;;
  ctx.font = &#x27;11px -apple-system, sans-serif&#x27;;
  ctx.textAlign = &#x27;center&#x27;;
  ctx.fillText(&#x27;ALTAS&#x27;, x1+bw/2, H-padBot+18);
  ctx.fillStyle = &#x27;#3a7a5a&#x27;;
  ctx.font = &#x27;bold 12px sans-serif&#x27;;
  ctx.fillText(&#x27;+$&#x27;+Math.round(al).toLocaleString(), x1+bw/2, baseY-h1-8);
  
  // CHURNS bar (starts from top of ALTAS, goes down)
  const x2 = padX + gap/2 + barW*2;
  const churnsTop = baseY - h1;  // top of altas
  const h2 = (ch/maxV)*chartH;
  ctx.fillStyle = &#x27;#FF4B33&#x27;;
  ctx.fillRect(x2, churnsTop, bw, h2);
  ctx.fillStyle = &#x27;#1B1B1B&#x27;;
  ctx.font = &#x27;11px sans-serif&#x27;;
  ctx.fillText(&#x27;CHURNS&#x27;, x2+bw/2, H-padBot+18);
  ctx.fillStyle = &#x27;#FF4B33&#x27;;
  ctx.font = &#x27;bold 12px sans-serif&#x27;;
  ctx.fillText(&#x27;-$&#x27;+Math.round(ch).toLocaleString(), x2+bw/2, churnsTop+h2+22);
  
  // Connector from altas top to churns top, and to net top
  ctx.strokeStyle = &#x27;#888&#x27;;
  ctx.setLineDash([3,3]);
  ctx.beginPath();
  ctx.moveTo(x1+bw, baseY-h1); ctx.lineTo(x2, baseY-h1);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2+bw, churnsTop+h2);
  
  // NET NEW bar
  const x3 = padX + gap/2 + barW*4;
  const netVal = Math.abs(net);
  const h3 = (netVal/maxV)*chartH;
  let netTop, netBot;
  if(net &gt;= 0){
    netBot = baseY;
    netTop = baseY - h3;
  } else {
    netTop = baseY;
    netBot = baseY + h3;
  }
  ctx.lineTo(x3, net&gt;=0 ? netTop : netBot);
  ctx.stroke();
  ctx.setLineDash([]);
  
  ctx.fillStyle = net&gt;=0 ? &#x27;#3a7a5a&#x27; : &#x27;#FF4B33&#x27;;
  ctx.fillRect(x3, Math.min(netTop, netBot), bw, h3);
  ctx.fillStyle = &#x27;#1B1B1B&#x27;;
  ctx.font = &#x27;11px sans-serif&#x27;;
  ctx.fillText(&#x27;NET NEW&#x27;, x3+bw/2, H-padBot+18);
  ctx.fillStyle = net&gt;=0 ? &#x27;#3a7a5a&#x27; : &#x27;#FF4B33&#x27;;
  ctx.font = &#x27;bold 13px sans-serif&#x27;;
  const sign = net&gt;=0 ? &#x27;+&#x27; : &#x27;-&#x27;;
  ctx.fillText(sign+&#x27;$&#x27;+Math.round(Math.abs(net)).toLocaleString(), x3+bw/2, net&gt;=0 ? netTop-8 : netBot+22);
  
  // Title
  ctx.fillStyle = &#x27;#4a3f30&#x27;;
  ctx.font = &#x27;10px sans-serif&#x27;;
  ctx.textAlign = &#x27;left&#x27;;
  ctx.fillText(&#x27;USD · Agosto 2026&#x27;, padX, 18);
}

// Initial draw for total
setTimeout(()=&gt;drawWaterfall(0), 100);
window.addEventListener(&#x27;resize&#x27;, ()=&gt;{
